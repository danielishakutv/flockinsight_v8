name: Deploy to production

on:
  push:
    branches: [production]
  # So you can re-run the last release, or deploy after fixing something on the
  # box, without an empty commit.
  workflow_dispatch:

# This job only reads the repo and talks to the VPS over SSH; it never needs to
# write back. The default token is broader than that, so narrow it.
permissions:
  contents: read

# One deploy at a time, and never cancel one midway: a half-finished release
# would leave the symlink and PM2 disagreeing about which build is live.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and release on the VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out the commit being deployed
        # Pinned to a commit, not a tag: a tag can be moved, and this step runs
        # with the SSH key that can reach production in the same job.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Load the SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS is not set."
            echo "Without a pinned host key the runner would trust whatever answers"
            echo "on that address and hand it a deploy. Generate one with:"
            echo "    ssh-keyscan -H <your.vps.ip>"
            echo "and paste the output into the SSH_KNOWN_HOSTS secret."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
        run: |
          # These end up inside a command string that a shell on the production
          # server parses, so refuse anything that could close a quote and run
          # something of its own.
          case "$APP_ROOT" in
            "") echo "::error::APP_ROOT is not set"; exit 1 ;;
            *[!A-Za-z0-9._/-]*) echo "::error::APP_ROOT has characters that are not allowed in a path"; exit 1 ;;
          esac
          case "$GITHUB_SHA" in
            "" | *[!0-9a-f]*) echo "::error::GITHUB_SHA is not a plain hex commit id"; exit 1 ;;
          esac
          case "$SSH_PORT" in
            "" | *[!0-9]*) echo "::error::SSH_PORT is not a number"; exit 1 ;;
          esac

          # The script is piped from this commit, so the deploy always runs the
          # version of deploy.sh that ships with the code being released. The
          # branch name is deliberately not passed on: DEPLOY_SHA already says
          # exactly what to build, and a branch name is attacker-shaped input
          # on workflow_dispatch.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            -o BatchMode=yes -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' DEPLOY_SHA='$GITHUB_SHA' bash -s" \
            < deploy/deploy.sh

      # The box reporting 200 on 127.0.0.1 while the world sees 522 is exactly
      # how a whole day of downtime went unnoticed once. Check from outside.
      - name: Verify the public site is serving this commit
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "::warning::PUBLIC_URL is not set — skipping the external check."
            exit 0
          fi
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$PUBLIC_URL/api/health" || true)"
            case "$body" in
              *"\"deployment\":\"$GITHUB_SHA\""*)
                echo "$PUBLIC_URL is serving ${GITHUB_SHA:0:7}"
                exit 0
                ;;
            esac
            echo "attempt $attempt: $PUBLIC_URL not on ${GITHUB_SHA:0:7} yet"
            sleep 6
          done
          echo "::error::$PUBLIC_URL never reported ${GITHUB_SHA:0:7}."
          echo "The deploy script verified the app locally and rolled back on failure,"
          echo "so suspect Apache, DNS or Cloudflare rather than the release itself."
          exit 1
