# Only Cloudflare may reach a site that Includes this, plus the box itself.
# Installed at /etc/apache2/cloudflare-only.conf and included by the port 443
# block of the site (see deploy/apache-reverse-proxy.conf).
#
# Added 2026-10-24: the origin answered HTTPS directly, so cf-connecting-ip
# could be forged and every IP rate limit and audit IP was spoofable.
#
# Ranges: https://www.cloudflare.com/ips-v4 and /ips-v6 as of 2026-10-24.
# When Cloudflare publishes new ranges: edit here and on the server,
# `apachectl configtest`, then `systemctl reload apache2`. A stale list shows
# up as "AH01630: client denied" lines from Cloudflare addresses in the site's
# error log.
#
# NEVER add RemoteIPHeader / RemoteIPTrustedProxy to a vhost that Includes
# this. mod_remoteip swaps in the visitor's address BEFORE `Require ip` runs,
# and every real visitor would be refused.
<RequireAny>
    Require ip 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
    Require ip 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
    Require ip 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
    Require ip 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    Require ip 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
    Require ip 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    Require ip 127.0.0.1 ::1
</RequireAny>
