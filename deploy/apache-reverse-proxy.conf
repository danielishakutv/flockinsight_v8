# FlockInsight — Apache reverse proxy directives
# Add these to your domain's Apache VirtualHost(s) in Virtualmin:
#   Virtualmin → (select domain) → Services → Configure Website
#   → "Edit Directives"  (add to BOTH the port 80 and port 443 blocks),
# or via Webmin → Servers → Apache → (your vhost).
#
# Requires modules: proxy, proxy_http, headers  (a2enmod proxy proxy_http headers)
# Change 3001 if you used a different PORT.

ProxyRequests Off
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# The recording service (src/recorder) listens on its own port, and the media
# server reaches it over a WebSocket at wss://<site>/rtc-ingest/... — so that
# one path is tunnelled to it, BEFORE the catch-all below. Requires
# proxy_wstunnel (a2enmod proxy_wstunnel). Change 3007 to match RECORDER_PORT.
#
# On a vhost that proxies with RewriteRule [P] rather than ProxyPass (as
# Virtualmin writes them), the equivalent is, before the catch-all rule:
#
#   RewriteCond %{HTTP:Upgrade} =websocket [NC]
#   RewriteCond %{REQUEST_URI} ^/rtc-ingest/
#   RewriteRule ^/?(.*)$ ws://127.0.0.1:3007/$1 [P,L]
ProxyPass /rtc-ingest/ ws://127.0.0.1:3007/rtc-ingest/

ProxyPass / http://127.0.0.1:3001/
ProxyPassReverse / http://127.0.0.1:3001/

# (optional) let the app see the real client IP
# RemoteIPHeader X-Forwarded-For
